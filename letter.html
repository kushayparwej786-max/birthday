<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Letter For You ❤️</title>

    <link rel="stylesheet" href="letter.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Floating Hearts -->
    <div id="floating-hearts"></div>

    <!-- Floating Balloons -->
    <div id="floating-balloons"></div>

    <!-- Sparkles -->
    <div id="sparkles"></div>

    <!-- Main Container -->
    <div class="container">

        <h1>
            💌 A Letter Just For You
        </h1>

        <p class="subtitle">
            Click the Envelope ❤️
        </p>

        <!-- Premium Envelope -->
        <div id="envelope" class="envelope">

            <!-- Back -->
            <div class="back"></div>

            <!-- Letter Inside -->
            <div class="letter-paper">

                <div class="paper-content">

                    <h2>Dear Beautiful ❤️</h2>

                    <p>
                        A special message is waiting for you...
                    </p>

                </div>

            </div>

            <!-- Envelope Folds -->

            <div class="left-fold"></div>

            <div class="right-fold"></div>

            <div class="bottom-fold"></div>

            <div class="top-fold"></div>

            <!-- Heart Seal -->

            <div class="seal">

                ❤️

            </div>

        </div>

        <!-- Real Letter -->

        <div id="letter" class="letter">

            <h2>
                Dear Beautiful ❤️
            </h2>

            <p id="letterText"></p>

            <button id="nextBtn">

                🎂 let's play game ❤️

            </button>

        </div>

    </div>

    <script src="letter.js"></script>

</body>

</html>
