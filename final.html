<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forever ❤️</title>

    <link rel="stylesheet" href="final.css">

</head>

<body>

    <!-- Background Effects -->

    <div id="fireworks"></div>

    <div id="floating-hearts"></div>

    <div id="rose-petals"></div>

    <div id="sparkles"></div>

    <!-- Main Container -->

    <div class="container">

        <h1 id="mainTitle">

            ❤️ One Last Surprise ❤️

        </h1>

        <p class="subtitle">

            Before this beautiful day ends...

            I want to tell you something...

        </p>

        <!-- Glass Card -->

        <div class="message-card">

            <h2>

                💌 A Message From My Heart

            </h2>

            <p id="typingMessage"></p>

        </div>

        <!-- Photo -->

        <div class="photo-box">

            <!-- Replace with your image -->

            <img src="images/photo4.jpg"
                 id="finalPhoto"
                 alt="Special Memory">

        </div>

        <!-- Quote -->

        <div class="quote">

            ❤️

            "Every moment with you is

            a beautiful memory."

            ❤️

        </div>

        <!-- End Button -->

        <button id="endBtn">

            ❤️ The End ❤️

        </button>

    </div>

    <!-- Optional Music -->

    <!--

    <audio id="bgMusic"
           autoplay
           loop>

        <source src="music/final.mp3"
                type="audio/mpeg">

    </audio>

    -->

    <script src="final.js"></script>

</body>
</html>
