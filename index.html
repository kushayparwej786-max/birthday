<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- Main Card -->
    <div class="container">

        <div class="card">

            <!-- Bunny -->
            <div class="bunny">🐰</div>

            <!-- Heading -->
            <h1>🎀 Happy Birthday 🎀</h1>

            <p class="message">
                Hey Beautiful... 🌸 <br><br>

                Someone Loves You <br>
                More Than Words Can Say... ❤️ <br><br>

                A Little Surprise <br>
                Is Waiting For You. <br><br>

                Enter The Secret Password <br>
                To Unlock It. 🎁
            </p>

            <!-- Password Dots -->
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Keypad -->
            <div class="keypad">

                <button>1</button>
                <button>2</button>
                <button>3</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>

                <button>❤️</button>
                <button>0</button>
                <button>⌫</button>

            </div>

            <button class="unlock-btn">
                Unlock My Heart 💖
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
