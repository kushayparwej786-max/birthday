<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Celebration 🎉</title>

    <link rel="stylesheet" href="celebration.css">

</head>
<body>

    <!-- Background Effects -->

    <div id="floating-hearts"></div>
    <div id="floating-balloons"></div>
    <div id="sparkles"></div>
    <div id="confetti"></div>

    <!-- Main Container -->

    <div class="container">

        <h1 id="title">
            🎉 Happy Birthday ❤️
        </h1>

        <p class="subtitle">
            Today is all about you ✨
        </p>

        <!-- Photo Frame -->

        <div class="photo-frame">

            <!-- Replace this image with your own -->

            <img src="images/photo6.jpg"
                 alt="Birthday Girl"
                 id="birthdayPhoto">

        </div>

        <!-- Wishes -->

        <div class="wish-box">

            <h2>💖 Special Wishes 💖</h2>

            <p id="typingText"></p>

        </div>

        <!-- Gift Icons -->

        <div class="gift-row">

            <div class="gift">🎁</div>
            <div class="gift">💝</div>
            <div class="gift">🌹</div>
            <div class="gift">🎂</div>
            <div class="gift">❤️</div>

        </div>

        <!-- Button -->

        <button id="nextBtn">

            💌 Final Surprise

        </button>

    </div>

    <!-- Optional Music -->

    <!--
    <audio id="birthdayMusic" autoplay loop>
        <source src="music/happy-birthday.mp3" type="audio/mpeg">
    </audio>
    -->

    <script src="celebration.js"></script>

</body>
</html>
