<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gift</title>

    <link rel="stylesheet" href="gift.css">

</head>

<body>

    <!-- Floating Hearts -->
    <div id="floating-hearts"></div>

    <!-- Main Container -->
    <div class="container">

        <h1>
            A Little Surprise For You 💖
        </h1>

        <p>
            Click the Gift to Open 🎁
        </p>

        <!-- Gift Box -->
        <div id="gift" class="gift">

            <!-- Gift Lid -->
            <div class="lid"></div>

            <!-- Bow -->
            <div class="bow"></div>

            <!-- Gift Box -->
            <div class="box"></div>

            <!-- Vertical Ribbon -->
            <div class="ribbon v"></div>

            <!-- Horizontal Ribbon -->
            <div class="ribbon h"></div>

        </div>
        
        <!-- 👇 YAHI ADD KARNA HAI -->
        <div id="gallery" class="gallery">

            <img src="images/photo1.jpg" class="photo">

            <img src="images/photo2.jpg" class="photo">

            <img src="images/photo3.jpg" class="photo">

            <img src="images/photo4.jpg" class="photo">
            
            <img src="images/photo5.jpg" class="photo">

            <img src="images/photo6.jpg" class="photo"
        </div>
       
     <!-- Memory Popup -->

<div id="memoryPopup" class="memory-popup">

    <div class="memory-card">

        <h2>❤️ Beautiful Memory</h2>

        <img id="popupImg" src="" alt="Memory Photo">

        <p id="memoryText">
            Your beautiful memory will appear here...
        </p>

        <div class="popup-buttons">

            <button id="closePopup">
                ❌ Close
            </button>

            <button id="nextMemory">
                ➡️ Next Memory
            </button>

        </div>

    </div>

</div>
        <button id="nextBtn">Next Surprise ❤️</button>
    </div>

    <script src="gift.js"></script>

</body>

</html>
